        #LOC_PW_sci_crewReport_default = Кажется, кербал наверху забыл придать этому месту смысл. Пожалуйста, сообщите об этой проблеме команде разработчиков Promised Worlds.

        // -------------------- Debdeb --------------------

        #LOC_PW_sci_crewReport_DebdebSrfLanded = Какой прекрасный день иметь глаза. \n\n...И теперь их нет.
        #LOC_PW_sci_crewReport_DebdebFlyingLow = You can see Debdeb's sunspots in great detail. That is not a good thing.
        #LOC_PW_sci_crewReport_DebdebFlyingHigh = You take a quick glance at Debdeb's surface and instantly regret your decision.
        #LOC_PW_sci_crewReport_DebdebInSpaceLow = Radiation levels outside are approaching lethal levels.
        #LOC_PW_sci_crewReport_DebdebInSpaceHigh = We are on a journey far from home, basking in the light of a million interstellar fireflies.

        // -------------------- Charr --------------------

        #LOC_PW_sci_crewReport_CharrSrfLandedMoltenCraters = Ты не уверен как ты тут приземлился. Лучше об этом сейчас не думать.
        #LOC_PW_sci_crewReport_CharrSrfLandedScorchedCraters = Вы не уверены, как вам удалось здесь приземлиться. Наверное, лучше не задерживаться надолго.
        #LOC_PW_sci_crewReport_CharrSrfLandedHotCraters = Ты рассматривешь огненный кратер. Тем же временем, твоя ракета плавится, как башня масла.
        #LOC_PW_sci_crewReport_CharrSrfLandedCraters = Вас вдавливает в кресло высокой гравитацией.
        #LOC_PW_sci_crewReport_CharrSrfLandedMetallicPlains = Светящиеся полосы железа стекают по бесконечным кратерам в их мягкие липкие центры. Вы жалеете, что в системе Кербола нет такой эпичной лавовой планеты (извините, Мохо).
        #LOC_PW_sci_crewReport_CharrSrfLandedRockyMountains = Океан огня течёт за горизонт и скрывается из виду. Это действительно великолепное зрелище.
        #LOC_PW_sci_crewReport_CharrSrfLandedPlateaus = Корабль слегка поскрипывает под высокой гравитацией.
        #LOC_PW_sci_crewReport_CharrSrfLandedNorthernCrater = Порода сдута, обнажая металл под ней.
        #LOC_PW_sci_crewReport_CharrSrfLandedNorthernCraterRays = Тонкие полосы исходят от массивного кратера. Вы вспоминаете лучистые кратеры Луны.
        #LOC_PW_sci_crewReport_CharrSrfLandedKrakensPedestal = Вам здесь не по себе, как будто что-то всемогущее таится поблизости.
        #LOC_PW_sci_crewReport_CharrInSpaceLow = Светящаяся поверхность Чарра тянется, складывается и течёт в завораживающем огненном танце. Это напоминает вам о жарких летних днях, кострах и оранжевых кербсиклах.
        #LOC_PW_sci_crewReport_CharrInSpaceHigh = Поверхность в рытвинах, красная и воспалённая - плохой случай космических угрей.

        // -------------------- Ovin --------------------

        #LOC_PW_sci_crewReport_OvinSrfLandedValleys = Трудно что-либо делать в этой высокой гравитации. Даже дышать тяжело.
        #LOC_PW_sci_crewReport_OvinSrfLandedDivets = Эти кольца ещё более впечатляют отсюда, снизу. Но не стоят всех усилий.
        #LOC_PW_sci_crewReport_OvinSrfLandedCrushlands = Вы глубоко в гравитационном колодце Овина - он же новый, постоянный дом вашего космического корабля.
        #LOC_PW_sci_crewReport_OvinSrfLandedFlats = Земля измельчена в бескрайнюю пустыню песка, пыли и других маленьких, относительно плоских вещей.
        #LOC_PW_sci_crewReport_OvinSrfLandedHighlands = Вы восхищаетесь сглаженным гравитацией ландшафтом, уходящим в неизведанное. Это прекрасное запустение.
        #LOC_PW_sci_crewReport_OvinSrfLandedHills = Как у Овина вообще есть какие-то холмы под таким огромным давлением - для вас загадка. Как вы планируете улететь - тоже загадка.
        #LOC_PW_sci_crewReport_OvinSrfLandedNedzerfjord = Недзерфьорд был назван в честь знаменитого Кербана Нездера, который умер от переломов ног, попытавшись унести слишком много закусок.
        #LOC_PW_sci_crewReport_OvinSrfLandedValleyofDespair = Добро пожаловать в Долину Отчаяния, названную так потому, что... ну, взгляните на неё.
        #LOC_PW_sci_crewReport_OvinSrfLandedDustyCrater = Космический корабль слегка погружается в мягкий реголит кратера, заставляя задуматься, что было бы, если бы на Овине были зыбучие пески. Будем надеяться, что их нет.
        #LOC_PW_sci_crewReport_OvinSrfLandedGreatRift = Великий Северный рифт - это огромная расходящаяся граница плит, где лава из мантии поднимается и остывает, образуя эти холмы и трещины.
        #LOC_PW_sci_crewReport_OvinSrfLandedGreatRiftDivergence = Вы находитесь прямо в центре самого опасного сейсмического места в системе Дебдеб. Тревожно.
        #LOC_PW_sci_crewReport_OvinFlyingLow = Вы боретесь, чтобы сохранить корабль целым под экстремальной гравитацией. Тем временем гравитация посмеивается над вашими жалкими усилиями.
        #LOC_PW_sci_crewReport_OvinFlyingHigh = Атмосфера обволакивает ваш корабль и пытается стянуть его вниз. Недалеко внизу гладкая тиковая поверхность Овина поёт песню сирены.
        #LOC_PW_sci_crewReport_OvinInSpaceLow = Поверхность Овина плоская как блин. Если вы спуститесь, вы станете таким же.
        #LOC_PW_sci_crewReport_OvinInSpaceHigh = Овин - бог мудрости и старости в древней кербальской мифологии. Судя по вашим предпочтениям в путешествиях, вы, кажется, не хотите ни того, ни другого.

        // -------------------- Gurdamma --------------------

        #LOC_PW_sci_crewReport_GurdammaSrfLandedAbyssalOceans = Вы сейчас на глубине нескольких "какого-чёрта" под водой. Вы жалеете, что не выдули всю оставшуюся газировку перед тем, как спуститься сюда.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedDeepOceans = Ваш корабль стонет под огромным давлением. Вы же понимаете, что это "Космическая программа Кербалов", а не "Подводная программа Кербалов", да?
        #LOC_PW_sci_crewReport_GurdammaSrfLandedOceans = Морское дно такое бесплодное.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShallows = Рядом разбиваются волны, более сильные, чем вы видели дома. Близость Донка и турбулентная атмосфера делают волны здесь довольно большими.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShores = Представьте, что вы смешали несколько тонн саргассума, тухлых яиц и копчёной ветчины в блендере, а затем оставили сохнуть на неделю. Вот где мы сейчас.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedLowlands = Земля влажная и песчаная. Скальные выступы и россыпи минералов тянутся к горизонту.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMidlands = Вы чувствуете себя как дома, заблудившись в одной из пустынь Кербина. Огромная луна и кольца наверху напоминают о том, насколько чужеродна эта планета на самом деле.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedHighlands = Влага собирается на бортах корабля. К счастью, бескислородная среда означает, что наши детали устойчивы к ржавчине. Если бы только то же самое можно было сказать о незапланированных разборках...
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMountains = Суповые облака бродят по залитому солнцем небу, пока вы любуетесь Гурдаммой с её самых высоких точек.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAlpineMountains = Белая пыль из близлежащих вулканов медленно конденсируется на склонах этих гор.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPeaks = Вид на изогнутые кратеры и вулканические горы Гурдаммы - отличное зрелище
        #LOC_PW_sci_crewReport_GurdammaSrfLandedVolcanoes = Вы заглядываете в тлеющую кальдеру. Тлеющая кальдера смотрит в ответ.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedVolcanoCraters = Гарантия производителя, конечно, не покрывает воздействие вулканов. Юристы сказали, что это большое "нельзя".
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMountBogue = Гора Бог названа в честь известного кербальского видеографа Бога Кербарка. Говорят, высота горы равна количеству его подписчиков.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenCoasts = Рыхлый пепел, падающий из шлейфов близлежащих активных вулканов, усеивает землю вокруг вас.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenLowlands = Вулканическая пыль покрывает испещрённый эрозией камень, как приправа обезвоженную пиццу.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenHighlands = Вулканическая пыль кружится в высокогорном ветру. Маленький пепельный дьявол проползает мимо корабля, прежде чем рассеяться в серый дым.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenMountains = Дым проплывает мимо корабля, угрожая забить его инструменты.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenAlpineMountains = Густые облака пыли из близлежащих вулканов наполняют воздух и собираются в сугробы на земле.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenPeaks = Пепел здесь падает быстро. До подножия горы далеко, она скрывается из виду, скрытая мутными облаками.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPoles = Воздух снаружи чище, так как большинство вулканов находится ближе к экватору.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPolarSeas = В отличие от полюсов Кербина, полюса Гурдаммы предлагают мало передышки от её жестокой жары. Если бы не атмосферное давление, вода бы кипела
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShankastRiver = Ааах... какое спокойное место! Кроме гигантского протопланетного диска, активно формирующейся луны и сильной вулканической активности, конечно. Возможно, оно не такое уж и спокойное в конце концов
        #LOC_PW_sci_crewReport_GurdammaSrfLandedTealRiver = Течение здесь спокойное. Передышка от остальных проблем планеты.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMylonRiver = Названная в честь текучей ткани, используемой для изготовления кербальских скафандров, река Майлон - красивый, но вонючий водный путь.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlines = Будучи континентальным прото-Кербином, для вас не сюрприз, что на Гурдамме есть тектоническая активность. Вы просто надеетесь, что эта активность не решит случиться прямо сейчас.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenFaultlines = Что хуже, чем быть рядом с активной линией разлома? Быть рядом с активной линией разлома, которая находится с подветренной стороны от активного вулкана.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineShallows = Затопленная линия разлома - довольно рискованное место для посадки. По крайней мере, эта не такая уж глубокая
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineOceans = Если бы это не было великим достижением межзвёздных исследований, это могло бы быть тем местом, о котором рассказывают в документальных фильмах о пропавших исследователях.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineTrenches = Интенсивная сейсмическая активность Гурдаммы создала глубокие траншеи; ничего подобного на Кербине нет
        #LOC_PW_sci_crewReport_GurdammaSplashed = Корабль качают сильные волны Гурдаммы.
        #LOC_PW_sci_crewReport_GurdammaSplashedAbyssalOcean = Океан простирается на огромное расстояние вниз. Судя по показаниям давления здесь, вы не хотите знать, что там на дне.
        #LOC_PW_sci_crewReport_GurdammaSplashedDeepOceans = Вы больше не в водах Кербина, вы медленно становитесь той самой слизью, которая является глубокими океанами Гурдаммы.
        #LOC_PW_sci_crewReport_GurdammaSplashedOceans = Корабль качают сильные волны Гурдаммы.
        #LOC_PW_sci_crewReport_GurdammaSplashedShallows = Вы приближаетесь к берегу, может быть, стоит пройти весь путь туда, чтобы увидеть землю впервые за целую вечность.
        #LOC_PW_sci_crewReport_GurdammaSplashedShores = Рядом разбиваются волны, более сильные, чем вы видели дома. Близость Донка и турбулентная атмосфера делают волны здесь довольно большими.
        #LOC_PW_sci_crewReport_GurdammaSplashedAshenCoasts = Вода больше не просто вонючая, она также содержит тонкий слой пепла от вулканов Гурдаммы.
